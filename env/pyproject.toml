[project]
name = "chatkms"
version = "0.4.0"
description = "chatKMS v0.4 — 多知识库知识管理系统后端（MCP 服务，源文件只读引用 + 双模式 RAG：BM25/semantic）"
requires-python = ">=3.10"
dependencies = [
    "pyyaml>=6.0",
    "jieba>=0.42.1",
    "rank-bm25>=0.2.2",
    "mcp>=1.0.0",
]

[project.optional-dependencies]
pdf = ["PyMuPDF>=1.23.0"]
semantic = ["chromadb>=0.5.0", "sentence-transformers>=2.2.0", "numpy>=1.24.0"]